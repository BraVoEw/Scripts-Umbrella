<style>
/* Minimal black: one centered column, white type, hairlines. Color comes only from the logo and the media. */
:root {
  --bg: #000; --surface: #0a0a0a; --card: #000; --card-2: #141414; --edge: #1f1f1f;
  --text: #fff; --muted: #8a8a8a; --dim: #5c5c5c; --accent: #fff; --accent-soft: #141414;
  --win: #fff; --lose: #ff6b6b; --shadow: none; --radius: 8px;
  --font-ui: "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); scroll-padding-top: 24px; }
body { margin: 0; color: var(--text); font: 400 16px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
img, video { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 3px; }
.col, .wrap { max-width: 860px; margin: 0 auto; padding-inline: 20px; }

.top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 24px; padding-block: 28px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; }
.brand svg { width: 22px; color: #e5484d; display: block; }
.nav { display: flex; flex-wrap: wrap; gap: 6px 20px; color: var(--muted); font-size: 14px; }
.nav a:hover, .nav button:hover, .nav a.on { color: #fff; }
.nav.main { margin-left: 8px; }
.nav.right { margin-left: auto; align-items: center; }
.lang { display: inline-flex; gap: 8px; margin-left: 4px; }
.lang button.on { color: #fff; }

.intro { padding-block: 56px 36px; }
.intro h1 { margin: 0 0 14px; font-size: clamp(32px, 5vw, 46px); line-height: 1.12; letter-spacing: -.03em; font-weight: 500; }
.intro h1 em { font-style: normal; }
.intro p { margin: 0; max-width: 520px; font-size: 17px; color: var(--muted); }
.facts { margin-top: 20px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }

.m { display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #0d0d0d; }
.m video, .m img { width: 100%; height: 100%; object-fit: cover; }
.script { position: relative; display: grid; grid-template-columns: 112px minmax(0, 1fr) auto auto; align-items: center; gap: 18px; padding-block: 14px; border-top: 1px solid var(--edge); }
.script:last-child { border-bottom: 1px solid var(--edge); }
.thumb { aspect-ratio: 16 / 9; border-radius: 5px; overflow: hidden; background: #0d0d0d; }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 100% 50%; }
.script h2 { margin: 0; font-size: 16px; line-height: 1.3; font-weight: 500; }
.script h2 small { margin-left: 6px; font-size: 13px; font-weight: 400; color: var(--muted); }
.script h2 a::after { content: ""; position: absolute; inset: 0; }
.script:hover h2 a { color: var(--muted); }
.script p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
.count { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.script .dl { position: relative; z-index: 1; padding: 7px 14px; }
.dl { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 6px; background: #fff; color: #000; font-size: 14px; font-weight: 500; white-space: nowrap; }
.dl:hover { background: #d4d4d4; }
.dl svg { width: 15px; height: 15px; }
.ghost { display: inline-flex; align-items: center; justify-content: center; padding: 9px 18px; border-radius: 6px; border: 1px solid #333; font-size: 14px; font-weight: 500; white-space: nowrap; }
.ghost:hover { border-color: #fff; }

section.block { padding-block: 44px; border-top: 1px solid var(--edge); }
section.block h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; font-weight: 500; }
section.block > .col > p, .sub { margin: 0 0 22px; color: var(--muted); max-width: 560px; }
.steps { list-style: none; counter-reset: s; margin: 0; padding: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px minmax(0, 1fr); padding-block: 12px; border-top: 1px solid var(--edge); }
.steps li:first-child { border-top: 0; padding-top: 2px; }
.steps li::before { content: counter(s); color: var(--dim); }
.steps b { font-weight: 500; }
.steps span { display: block; color: var(--muted); font-size: 15px; }
code { font: 13.5px ui-monospace, "Cascadia Code", Consolas, monospace; color: #fff; background: var(--card-2); padding: 1px 6px; border-radius: 4px; }
.note { margin: 18px 0 0; color: var(--muted); font-size: 14.5px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.feed { margin: 0 0 22px; }
.feed .don { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 16px; padding-block: 9px; border-top: 1px solid var(--edge); font-size: 15px; }
.feed .don b { font-weight: 500; }
.feed .don em { font-style: normal; font-variant-numeric: tabular-nums; }
.feed .don span { grid-column: 1 / -1; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.thanks { display: flex; flex-direction: column; }
.thank { padding-block: 9px; border-top: 1px solid var(--edge); font-size: 15px; display: flex; flex-wrap: wrap; gap: 0 12px; }
.thank b { font-weight: 500; } .thank a:hover { color: var(--muted); }
.thank span { color: var(--muted); }
.empty { color: var(--muted); font-size: 15px; }
footer { padding-block: 28px 60px; border-top: 1px solid var(--edge); }
footer .col { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 20px; color: var(--muted); font-size: 14px; }
footer a:hover { color: #fff; }

/* script page */
.back { display: inline-block; margin: 28px 0 28px; color: var(--muted); font-size: 14px; }
.back:hover { color: #fff; }
.detail h1 { margin: 0 0 6px; font-size: clamp(30px, 4.6vw, 42px); line-height: 1.12; letter-spacing: -.03em; font-weight: 500; }
.detail .facts { margin: 0 0 14px; }
.detail .desc { margin: 0 0 26px; color: var(--muted); font-size: 17px; max-width: 640px; }
.detail .btns { margin-bottom: 32px; }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.thumbs button { padding: 0; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; background: #0d0d0d; cursor: zoom-in; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; opacity: .75; }
.thumbs button:hover img { opacity: 1; }
.groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; margin: 44px 0 80px; }
.group h4 { margin: 0 0 8px; font-size: 15px; font-weight: 500; }
.group ul { margin: 0; padding: 0; list-style: none; }
.group li { padding-block: 7px; border-top: 1px solid var(--edge); color: var(--muted); font-size: 15px; }

/* centered windows over a blurred page */
.win { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; overflow-y: auto; }
.win-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.win-box { position: relative; width: min(560px, 100%); background: #0a0a0a; border: 1px solid #262626; border-radius: 12px; padding: 32px; }
.win-box h2 { margin: 0 34px 6px 0; font-size: 26px; line-height: 1.15; letter-spacing: -.025em; font-weight: 500; }
.win-box .sub { font-size: 15px; margin-bottom: 22px; }
.x { position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.x:hover { color: #fff; }
.x svg { width: 18px; height: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: #141414; border-radius: 8px; margin-bottom: 18px; }
.seg button { padding: 8px 6px; border-radius: 5px; color: var(--muted); font-size: 14px; text-align: center; }
.seg button.on { background: #fff; color: #000; }
.fb { display: flex; flex-direction: column; gap: 14px; }
.fb label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--muted); }
.fb select, .fb textarea, .fb input { font: 400 15px var(--font-ui); color: #fff; background: #000; border: 1px solid #333; border-radius: 6px; padding: 10px 12px; outline: none; }
.fb textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.fb select:focus, .fb textarea:focus, .fb input:focus { border-color: #fff; }
.fb .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.fb-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.fb-foot .dl[disabled] { opacity: .5; cursor: default; }
.st { font-size: 14px; color: var(--muted); }
.st.ok { color: #fff; } .st.err { color: var(--lose); }
.cnt { margin-left: auto; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.pane h4 { margin: 0 0 2px; font-size: 18px; font-weight: 500; }
.pane p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
.addr { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; border: 1px solid #333; border-radius: 6px; }
.addr code { flex: 1; min-width: 0; background: none; padding: 0; overflow-wrap: anywhere; }
.addr button { flex: none; padding: 6px 12px; border-radius: 5px; background: #fff; color: #000; font-size: 13px; font-weight: 500; }
.warn { margin-top: 10px; font-size: 13.5px; color: var(--lose); }
.lightbox { background: rgba(0, 0, 0, .94); }

/* stats on black: flat, hairlines */
.stats-page { padding-block: 40px 60px; }
.sx-hero { background: none; border: 0; border-radius: 0; padding: 32px 0 44px; align-items: flex-end; }
.sx-kick { color: var(--muted); font-size: 14px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.sx-main b { font-weight: 500; font-size: clamp(56px, 10vw, 96px); }
.sx-pill { background: none; border: 0; padding: 0 0 0 28px; min-width: 0; backdrop-filter: none; }
.sx-pill b { font-weight: 500; font-size: 24px; }
.sx-card { border-radius: 8px; animation: none; }
.sx-card::before { display: none; }
.sx-top h4 { font-weight: 500; font-size: 17px; }
.sx-ver { background: none; padding: 0; }
.sx-num { font-weight: 500; font-size: 44px; }
.sx-deltas em { font-weight: 500; }
.sx-releases { border: 0; border-radius: 0; padding: 26px 0 0; background: none; }
.sx-releases h3 { font-weight: 500; font-size: 22px; letter-spacing: -.02em; margin-bottom: 12px; }
.sx-releases li b, .sx-releases li em { font-weight: 500; }
.sx-releases li small { background: none; padding: 0; color: var(--muted); font-weight: 400; }

/* a bit of life: glow and dots behind the title, soft entrances, hover light on rows */
.backdrop { position: absolute; left: 0; right: 0; top: 0; height: 640px; z-index: -1; overflow: hidden; pointer-events: none; }
.backdrop::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, .09) 1px, transparent 1px); background-size: 26px 26px; -webkit-mask-image: radial-gradient(70% 80% at 50% 0%, #000, transparent); mask-image: radial-gradient(70% 80% at 50% 0%, #000, transparent); }
.backdrop::after { content: ""; position: absolute; left: 50%; top: -240px; width: min(1100px, 130vw); height: 640px; margin-left: calc(min(1100px, 130vw) / -2); border-radius: 50%; background: radial-gradient(closest-side, rgba(229, 72, 77, .24), transparent); animation: breathe 9s ease-in-out infinite alternate; }
@keyframes breathe { to { transform: translateY(30px) scale(1.14); opacity: .65; } }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
.intro { padding-block: 64px 44px; }
.intro h1 { font-size: clamp(40px, 7vw, 68px); line-height: 1.04; letter-spacing: -.04em; margin-bottom: 18px; background: linear-gradient(180deg, #fff 45%, #a8a8a8); -webkit-background-clip: text; background-clip: text; color: transparent; animation: rise .8s cubic-bezier(.2, .8, .2, 1) backwards; }
.intro h1 em { background: linear-gradient(180deg, #ff7076, #e5484d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.intro p { animation: rise .8s .08s cubic-bezier(.2, .8, .2, 1) backwards; }
.facts { animation: rise .8s .16s cubic-bezier(.2, .8, .2, 1) backwards; }
.brand svg { transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
.brand:hover svg { transform: rotate(-8deg) scale(1.12); }
.nav a, .nav > button { position: relative; transition: color .2s; }
.nav a::after, .nav > button::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -3px; height: 1px; background: #fff; transition: right .25s cubic-bezier(.2, .8, .2, 1); }
.nav a:hover::after, .nav > button:hover::after, .nav a.on::after { right: 0; }

#scripts { display: flex; flex-direction: column; gap: 10px; }
.script, .script:last-child { --x: 50%; --y: 50%; overflow: hidden; padding: 12px 16px 12px 12px; border: 1px solid #1c1c1c; border-radius: 14px; background: #080808; grid-template-columns: 148px minmax(0, 1fr) auto auto; transition: border-color .25s, transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s; animation: rise .7s cubic-bezier(.2, .8, .2, 1) backwards; }
.script:nth-child(1) { animation-delay: .22s; } .script:nth-child(2) { animation-delay: .3s; } .script:nth-child(3) { animation-delay: .38s; } .script:nth-child(4) { animation-delay: .46s; }
.script::before { content: ""; position: absolute; inset: 0; background: radial-gradient(320px circle at var(--x) var(--y), color-mix(in srgb, var(--c) 20%, transparent), transparent 70%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.script:hover { border-color: color-mix(in srgb, var(--c) 45%, #1c1c1c); transform: translateY(-2px); box-shadow: 0 16px 44px -22px var(--c); }
.script:hover::before { opacity: 1; }
.script:hover h2 a { color: #fff; }
.script h2 { font-size: 18px; letter-spacing: -.015em; }
.thumb { position: relative; border-radius: 8px; }
.thumb img { transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
.script:hover .thumb img { transform: scale(1.06); }
.thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 100% 50%; opacity: 0; transition: opacity .35s; }
.thumb video.on { opacity: 1; }
.dl { position: relative; overflow: hidden; transition: background .2s, transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .25s; }
.dl:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 6px 22px -6px rgba(255, 255, 255, .55); }
.dl::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(0, 0, 0, .14), transparent); transform: skewX(-18deg); transition: left .55s; }
.dl:hover::after { left: 130%; }
.ghost { transition: border-color .2s, transform .2s cubic-bezier(.2, .8, .2, 1), background .2s; }
.ghost:hover { transform: translateY(-1px); background: #111; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s cubic-bezier(.2, .8, .2, 1), transform .7s cubic-bezier(.2, .8, .2, 1); }
.reveal.in { opacity: 1; transform: none; }
.detail > * { animation: rise .55s cubic-bezier(.2, .8, .2, 1) backwards; }
.detail > :nth-child(2) { animation-delay: .04s; } .detail > :nth-child(3) { animation-delay: .08s; } .detail > :nth-child(4) { animation-delay: .12s; } .detail > :nth-child(5) { animation-delay: .16s; } .detail > :nth-child(n+6) { animation-delay: .2s; }
.thumbs button { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
.thumbs button:hover { transform: translateY(-2px); }
.thumbs img { transition: opacity .25s; }
.win-back { animation: fadein .25s; }
.win-box { animation: pop .32s cubic-bezier(.2, .9, .25, 1.08); box-shadow: 0 30px 90px -20px rgba(0, 0, 0, .9); }
@keyframes fadein { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } }
.seg button { transition: background .2s, color .2s; }
.sx-card { animation: rise .6s cubic-bezier(.2, .8, .2, 1) backwards; transition: border-color .25s, transform .3s cubic-bezier(.2, .8, .2, 1); }
.sx-card:hover { border-color: color-mix(in srgb, var(--c) 45%, #1f1f1f); transform: translateY(-2px); }
.sx-main b { background: linear-gradient(180deg, #fff 45%, #a8a8a8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sx-hero { position: relative; animation: rise .6s cubic-bezier(.2, .8, .2, 1) backwards; }

/* bottom of the page: finale with glow, then thanks */
.light { --x: 50%; --y: 50%; --c: #e5484d; position: relative; overflow: hidden; border: 1px solid #1c1c1c; border-radius: 16px; background: #080808; transition: border-color .25s, transform .3s cubic-bezier(.2, .8, .2, 1), box-shadow .3s; }
.light::before { content: ""; position: absolute; inset: 0; background: radial-gradient(360px circle at var(--x) var(--y), color-mix(in srgb, var(--c) 18%, transparent), transparent 70%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.light:hover { border-color: color-mix(in srgb, var(--c) 45%, #1c1c1c); transform: translateY(-2px); box-shadow: 0 18px 50px -26px var(--c); }
.light:hover::before { opacity: 1; }
.light > * { position: relative; }

.heart { color: #e5484d; display: inline-flex; }
.heart svg { width: 20px; height: 20px; }

.end2 { position: relative; overflow: hidden; text-align: center; padding-block: 40px 28px; isolation: isolate; }
.end2::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; width: min(760px, 100%); height: 420px; margin: -230px 0 0 calc(min(760px, 100%) / -2); border-radius: 50%; background: radial-gradient(closest-side, rgba(229, 72, 77, .22), transparent); animation: breathe 9s ease-in-out infinite alternate; }
#end .end2 h2 { margin: 0 0 16px; font-size: clamp(36px, 6.4vw, 60px); line-height: 1.05; letter-spacing: -.04em; font-weight: 500; background: linear-gradient(180deg, #fff 45%, #a8a8a8); -webkit-background-clip: text; background-clip: text; color: transparent; }
.end2 h2 em { font-style: normal; background: linear-gradient(180deg, #ff7076, #e5484d); -webkit-background-clip: text; background-clip: text; color: transparent; }
.end2 p { margin: 0 auto 26px; max-width: 520px; color: var(--muted); }
.end2 .btns { justify-content: center; }
.end2 .dl, .end2 .ghost { padding: 12px 22px; font-size: 15px; }
.support-line { display: inline-flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin-top: 40px; padding: 10px 18px; border: 1px solid #1c1c1c; border-radius: 999px; background: #080808; font-size: 14.5px; transition: border-color .25s, transform .25s cubic-bezier(.2, .8, .2, 1); }
.support-line:hover { border-color: #e5484d; transform: translateY(-1px); }
.support-line b { font-weight: 500; }
.support-line span { color: var(--muted); }
.support-line svg { width: 16px; height: 16px; }
.support-line .heart { color: #e5484d; }

.thx { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.thx .light { padding: 22px; min-height: 148px; }
.thx h3 { margin: 0 0 14px; font-size: 15px; font-weight: 500; }
.thx .empty { font-size: 14.5px; }
.thanks { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; }
.feed { margin: 0; }
.feed .don:first-child { border-top: 0; padding-top: 0; }
.thank { padding: 7px 13px; border: 1px solid #1c1c1c; border-radius: 999px; background: #080808; font-size: 14px; }


@media (max-width: 680px) {
  .nav.main { margin-left: 0; order: 3; width: 100%; }
  .intro { padding-block: 32px 28px; }
  .script, .script:last-child { grid-template-columns: 80px minmax(0, 1fr) auto; gap: 12px; padding: 10px; }
  .script h2 { font-size: 16px; }
  .script .count { display: none; }
  .groups { grid-template-columns: minmax(0, 1fr); gap: 24px; margin-bottom: 56px; }
  .thx { grid-template-columns: minmax(0, 1fr); }
  .win { padding: 12px; }
  .win-box { padding: 24px 20px; }
  .sx-pill { padding: 0 24px 0 0; }
}
</style>
</head>

<div class="backdrop" aria-hidden="true"></div>
<header class="col top">
  <a class="brand" href="#"><span id="mark"></span>BraVoEw</a>
  <nav class="nav main">
    <a href="#scripts" data-i18n="nav_scripts"></a>
    <a href="#stats" data-nav="stats" data-i18n="nav_stats"></a>
    <a href="#install" data-i18n="nav_install"></a>
  </nav>
  <nav class="nav right">
    <a href="#support" data-i18n="nav_feedback"></a>
    <button type="button" data-donate data-i18n="donate_btn"></button>

  </nav>
</header>

<main>
  <div id="home">
    <div id="list-view">
      <div class="col intro">
        <h1 data-i18n-html="hero_title"></h1>
        <p data-i18n="hero_lead"></p>
        <div class="facts"><b data-count></b> <span data-pl="scripts" data-pl-n="count"></span> · <b data-total>—</b> <span data-pl="downloads" data-pl-n="total"></span> · <span data-i18n="updated"></span> <b data-last></b></div>
      </div>
      <div class="col" id="scripts" style="padding-bottom: 56px"></div>

      <section class="block" id="install"><div class="col">
        <h2 data-i18n="sec_install"></h2>
        <p data-i18n="sec_install_sub"></p>
        <ol class="steps">
          <li><div><b data-i18n="s1_t"></b><span data-i18n-html="s1_d"></span></div></li>
          <li><div><b data-i18n="s2_t"></b><span data-i18n-html="s2_d"></span></div></li>
          <li><div><b data-i18n="s3_t"></b><span data-i18n-html="s3_d"></span></div></li>
          <li><div><b data-i18n="s4_t"></b><span data-i18n-html="s4_d"></span></div></li>
        </ol>
        <p class="note" data-i18n="note_upd"></p>
      </div></section>

      <section class="block" id="support"><div class="col" id="end"></div></section>

      <section class="block" id="thanks"><div class="col">
        <h2 data-i18n="thanks_title"></h2>
        <div class="thx">
          <div class="light"><h3 id="thx-ideas"></h3><div class="thanks" id="thanks-list"></div></div>
          <div class="light"><h3 id="thx-don"></h3><div class="feed" id="feed"></div></div>
        </div>
      </div></section>
    </div>
    <div class="col detail" id="detail" hidden></div>
  </div>
  <div id="stats-view" hidden></div>
</main>

<footer><div class="col"><span>BraVoEw</span><a href="https://github.com/BraVoEw/Scripts-Umbrella" target="_blank" rel="noopener">GitHub</a></div></footer>

<div class="win" id="fbw" hidden><div class="win-back" data-close></div><div class="win-box" role="dialog" aria-modal="true" aria-labelledby="fbw-t"><button class="x" type="button" data-close></button><h2 id="fbw-t" data-i18n="fb_pay"></h2><p class="sub" data-i18n="fb_how3"></p><div id="fb-body"></div></div></div>
<div class="win" id="dnw" hidden><div class="win-back" data-close></div><div class="win-box" role="dialog" aria-modal="true" aria-labelledby="dnw-t"><button class="x" type="button" data-close></button><h2 id="dnw-t" data-i18n="dn_side"></h2><p class="sub" data-i18n="dn_side_lead"></p><div id="dn-body"></div></div></div>

<script src="core.js?v=13"></script>
<script>
(function () {
  var LOGO = '<svg viewBox="8 14 84 73" fill="currentColor" aria-hidden="true"><path d="M40 30v9.5L25 50l15 10.5V70L11 54.5v-9z"/><path d="M60 30v9.5L75 50 60 60.5V70l29-15.5v-9z"/><path d="M53 21.5 60.5 17 48 79.5 40.5 84z"/></svg>';
  var WORDS = { ru: { back: "Все скрипты", ideas: "За идеи и баги", don: "За донаты", noDon: "Здесь будут те, кто поддержал скрипты." }, en: { back: "All scripts", ideas: "For ideas and bugs", don: "For donations", noDon: "People who supported the scripts will be listed here." } };
  var esc = Site.esc, $ = function (id) { return document.getElementById(id); };
  var listView = $("list-view"), detail = $("detail"), scripts = $("scripts");
  var shown = null;
  $("mark").innerHTML = LOGO;
  Array.prototype.forEach.call(document.querySelectorAll(".x"), function (b) { b.innerHTML = Site.icon("close"); });

  /* ---------- scripts ---------- */

  function dlLink(e) { return '<a class="dl" data-href="' + e.key + '" href="' + Site.info[e.key].href + '">' + Site.t("download") + "</a>"; }
  function rowHtml(e) {
    return '<article class="script k-' + e.key + '" data-k="' + e.key + '"><div class="thumb">' + Site.cover(e) + "</div>" +
      '<div><h2><a href="#' + e.key + '">' + esc(e.name) + '</a><small data-ver="' + e.key + '"></small></h2><p>' + Site.L(e).tagline + "</p></div>" +
      '<span class="count"><span data-dl="' + e.key + '"></span> <span data-pl="downloads" data-pl-n="' + e.key + '"></span></span>' + dlLink(e) + "</article>";
  }
  function detailHtml(e) {
    var L = Site.L(e), links = Site.links(e);
    return '<a class="back" href="#scripts">← ' + WORDS[Site.lang].back + "</a><h1>" + esc(e.name) + "</h1>" +
      '<div class="facts"><span data-ver="' + e.key + '"></span> · <span data-dl="' + e.key + '"></span> <span data-pl="downloads" data-pl-n="' + e.key + '"></span> · <span data-date="' + e.key + '"></span></div>' +
      '<p class="desc">' + L.desc + "</p>" +
      '<div class="btns">' + dlLink(e) + '<a class="ghost" href="' + links.changes + '" target="_blank" rel="noopener">' + Site.t("changes") + '</a><a class="ghost" href="' + links.more + '" target="_blank" rel="noopener">GitHub</a></div>' +
      '<div class="m">' + Site.media(e, { autoplay: true, controls: !!e.video }) + "</div>" + Site.thumbs(e) + Site.groups(e);
  }
  function showDetail(key) {
    shown = key;
    listView.hidden = true;
    detail.hidden = false;
    detail.innerHTML = detailHtml(Site.byKey(key));
    Site.fill(detail);
    window.scrollTo(0, 0);
    document.title = Site.byKey(key).name + " · BraVoEw";
  }
  function showList() {
    if (!shown) return;
    shown = null;
    var v = detail.querySelector("video");
    if (v) v.pause();
    detail.hidden = true;
    detail.innerHTML = "";
    listView.hidden = false;
    document.title = Site.t("title");
  }

  // Row hover: light follows the mouse, the thumbnail plays the script's video.
  var canHover = window.matchMedia("(hover: hover)").matches;
  scripts.addEventListener("pointermove", function (ev) {
    var row = ev.target.closest && ev.target.closest(".script");
    if (!row) return;
    var b = row.getBoundingClientRect();
    row.style.setProperty("--x", ev.clientX - b.left + "px");
    row.style.setProperty("--y", ev.clientY - b.top + "px");
  });
  function hoverVideo(row) {
    var e = Site.byKey(row.getAttribute("data-k")), v = null;
    if (!e.video || !canHover) return;
    row.addEventListener("pointerenter", function () {
      if (!v) {
        v = document.createElement("video");
        v.muted = true; v.loop = true; v.playsInline = true;
        v.src = Site.asset(e.preview || e.video);
        row.querySelector(".thumb").appendChild(v);
      }
      var p = v.play();
      if (p && p.then) p.then(function () { v.classList.add("on"); }).catch(function () {});
    });
    row.addEventListener("pointerleave", function () { if (v) { v.classList.remove("on"); v.pause(); } });
  }

  // Blocks below the list appear softly when scrolled to.
  (function () {
    var blocks = document.querySelectorAll("section.block");
    if (!("IntersectionObserver" in window) || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var io = new IntersectionObserver(function (list) {
      list.forEach(function (it) { if (it.isIntersecting) { it.target.classList.add("in"); io.unobserve(it.target); } });
    }, { threshold: 0.12 });
    Array.prototype.forEach.call(blocks, function (b) { b.classList.add("reveal"); io.observe(b); });
  })();

  /* ---------- windows ---------- */

  var openWin = null;
  function open(win) {
    if (openWin && openWin !== win) close();
    openWin = win;
    win.hidden = false;
    document.documentElement.style.overflow = "hidden";
  }
  function close() {
    if (!openWin) return;
    openWin.hidden = true;
    openWin = null;
    document.documentElement.style.overflow = "";
    if (location.hash === "#feedback" || location.hash === "#donate") history.replaceState(null, "", location.pathname + location.search + "#support");
  }
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t.closest) return;
    if (t.closest("[data-close]")) { close(); return; }
    var b = t.closest("[data-fb]");
    if (b) { openFb(b.getAttribute("data-fb")); return; }
    if (t.closest("[data-donate]")) openDn();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape" || document.querySelector(".lightbox")) return;
    if (openWin) close();
    else if (shown) location.hash = "#scripts";
  });

  /* ---------- idea / bug form: sent to the Telegram worker from Site.cfg.feedback ---------- */

  var fb = { kind: "idea", script: "", text: "", tg: "" };
  function fbHtml() {
    var opts = Site.catalog.map(function (e) { return [e.name, e.name]; }).concat([["site", Site.t("fb_site")], ["other", Site.t("fb_other")]]);
    return '<form class="fb" id="fb" novalidate><div class="seg" role="radiogroup"><button type="button" role="radio" data-kind="idea">' + Site.t("fb_idea") + '</button><button type="button" role="radio" data-kind="bug">' + Site.t("fb_bug") + "</button></div>" +
      "<label>" + Site.t("fb_script") + '<select name="script">' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + "</option>"; }).join("") + "</select></label>" +
      "<label>" + Site.t("fb_text") + '<textarea name="text" maxlength="2000"></textarea></label>' +
      "<label>" + Site.t("fb_tg") + '<input name="tg" maxlength="33" placeholder="@nickname" autocomplete="off" spellcheck="false"></label>' +
      '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<div class="fb-foot"><button class="dl" type="submit">' + Site.t("fb_send") + '</button><span class="st" role="status"></span><span class="cnt"></span></div></form>';
  }
  function fbBind() {
    var f = $("fb"), st = f.querySelector(".st"), cnt = f.querySelector(".cnt");
    function sync() {
      Array.prototype.forEach.call(f.querySelectorAll("[data-kind]"), function (b) {
        var on = b.getAttribute("data-kind") === fb.kind;
        b.classList.toggle("on", on);
        b.setAttribute("aria-checked", on);
      });
      f.text.placeholder = Site.t(fb.kind === "bug" ? "fb_ph_bug" : "fb_ph_idea");
      cnt.textContent = f.text.value.length + " / 2000";
    }
    function say(msg, cls) { st.textContent = msg; st.className = "st" + (cls ? " " + cls : ""); }
    if (fb.script) f.script.value = fb.script;
    f.text.value = fb.text;
    f.tg.value = fb.tg;
    sync();
    f.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-kind]");
      if (b) { fb.kind = b.getAttribute("data-kind"); sync(); }
    });
    f.addEventListener("input", function () { fb.script = f.script.value; fb.text = f.text.value; fb.tg = f.tg.value; sync(); say(""); });
    f.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var text = f.text.value.trim(), tg = f.tg.value.trim().replace(/^@/, "");
      if (text.length < 5) { say(Site.t("fb_short"), "err"); f.text.focus(); return; }
      if (tg && !/^[A-Za-z0-9_]{4,32}$/.test(tg)) { say(Site.t("fb_badtg"), "err"); f.tg.focus(); return; }
      if (!Site.cfg.feedback) { say(Site.t("fb_off"), "err"); return; }
      var e = Site.catalog.filter(function (x) { return x.name === f.script.value; })[0];
      var btn = f.querySelector("[type=submit]");
      btn.disabled = true;
      say(Site.t("fb_sending"));
      fetch(Site.cfg.feedback, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind: fb.kind, script: f.script.value, version: e ? Site.info[e.key].ver : "", text: text, tg: tg, lang: Site.lang, website: f.website.value })
      }).then(function (r) { return r.json().catch(function () { return {}; }); })
        .then(function (d) {
          if (d.error === "banned") { say(Site.t("fb_banned"), "err"); return; }
          if (d.error === "rate") { say(Site.t("fb_rate"), "err"); return; }
          if (!d.ok) return Promise.reject("bad");
          fb.text = ""; f.text.value = ""; sync();
          say(Site.t("fb_ok"), "ok");
        })
        .catch(function () { say(Site.t("fb_err"), "err"); })
        .then(function () { btn.disabled = false; });
    });
  }
  function openFb(kind) {
    if (kind) fb.kind = kind;
    $("fb-body").innerHTML = fbHtml();
    fbBind();
    open($("fbw"));
    $("fb").text.focus({ preventScroll: true });
  }

  /* ---------- donations: region tabs, recent donations ---------- */

  var dnTab = (navigator.language || "").toLowerCase().indexOf("uk") === 0 ? "ua" : "";
  function dnHtml() {
    var d = Site.cfg.donate, tab = dnTab || (Site.lang === "en" ? "world" : "ru"), pane;
    if (tab === "world") {
      pane = "<h4>USDT · TRC20</h4><p>" + Site.t("dn_world_desc") + "</p>" + (d.usdt
        ? '<div class="addr"><code>' + esc(d.usdt) + '</code><button type="button" data-copy>' + Site.t("dn_copy") + '</button></div><div class="warn">' + Site.t("dn_warn") + "</div>"
        : '<span class="empty">' + Site.t("dn_soon") + "</span>");
    } else {
      var url = tab === "ru" ? d.ru : d.ua;
      pane = "<h4>" + (tab === "ru" ? "DonationAlerts" : "Donatello") + "</h4><p>" + Site.t(tab === "ru" ? "dn_ru_desc" : "dn_ua_desc") + "</p>" +
        (url ? '<a class="dl" href="' + esc(url) + '" target="_blank" rel="noopener">' + Site.t("dn_go") + "</a>" : '<span class="empty">' + Site.t("dn_soon") + "</span>");
    }
    return '<div class="seg" role="tablist">' + ["ru", "ua", "world"].map(function (k) {
      return '<button type="button" role="tab" data-tab="' + k + '"' + (k === tab ? ' class="on" aria-selected="true"' : "") + ">" + Site.t("dn_tab_" + k) + "</button>";
    }).join("") + '</div><div class="pane">' + pane + "</div>";
  }
  function openDn() { $("dn-body").innerHTML = dnHtml(); open($("dnw")); }
  $("dnw").addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-tab]");
    if (t) { dnTab = t.getAttribute("data-tab"); $("dn-body").innerHTML = dnHtml(); return; }
    var c = ev.target.closest("[data-copy]");
    if (c && navigator.clipboard) navigator.clipboard.writeText(Site.cfg.donate.usdt).then(function () { c.textContent = Site.t("dn_copied"); });
  });
  function money(x) {
    var n = Number(x.amount) || 0, c = String(x.currency || "").toUpperCase();
    var sym = { RUB: " ₽", UAH: " ₴", USD: " $", EUR: " €", USDT: " USDT" }[c] || (c ? " " + c : "");
    return Site.nf(Math.round(n * 100) / 100) + sym;
  }
  function renderFeed() {
    var list = (Site.cfg.donations || []).slice(0, 5);
    $("thx-don").textContent = WORDS[Site.lang].don;
    $("feed").innerHTML = !list.length ? '<div class="empty">' + WORDS[Site.lang].noDon + "</div>" : list.map(function (x) {
      return '<div class="don"><b>' + esc(x.name || Site.t("dn_anon")) + "</b><em>" + money(x) + "</em>" + (x.message ? "<span>" + esc(x.message) + "</span>" : "") + "</div>";
    }).join("");
  }
  function renderThanks() {
    var list = Site.cfg.thanks;
    $("thx-ideas").textContent = WORDS[Site.lang].ideas;
    $("thanks-list").innerHTML = !list.length ? '<div class="empty">' + Site.t("thanks_empty") + "</div>" : list.map(function (p) {
      var name = p.link ? '<a href="' + esc(p.link) + '" target="_blank" rel="noopener"><b>' + esc(p.name) + "</b></a>" : "<b>" + esc(p.name) + "</b>";
      return '<div class="thank">' + name + "<span>" + esc(p[Site.lang] || p.ru || "") + "</span></div>";
    }).join("");
  }

  /* ---------- bottom of the page ---------- */

  var HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  function renderEnd() {
    var t = Site.t;
    $("end").innerHTML = '<div class="end2"><h2>' + esc(t("fb_pay")).replace(/(\S+)$/, "<em>$1</em>") + "</h2><p>" + t("fb_pay_lead") + "</p>" +
      '<div class="btns"><button type="button" class="dl" data-fb="idea">' + t("fb_btn_idea") + '</button><button type="button" class="ghost" data-fb="bug">' + t("fb_btn_bug") + "</button></div>" +
      '<button type="button" class="support-line" data-donate><span class="heart">' + HEART + "</span><b>" + t("donate_btn") + "</b><span>DonationAlerts · Donatello · USDT</span></button></div>";
  }
  document.addEventListener("pointermove", function (ev) {
    var el = ev.target.closest && ev.target.closest(".light");
    if (!el) return;
    var b = el.getBoundingClientRect();
    el.style.setProperty("--x", ev.clientX - b.left + "px");
    el.style.setProperty("--y", ev.clientY - b.top + "px");
  });

  Site.mount({
    render: function () {
      scripts.innerHTML = Site.catalog.map(rowHtml).join("");
      Array.prototype.forEach.call(scripts.children, hoverVideo);
      renderEnd();
      renderFeed();
      renderThanks();
      if (shown) { var key = shown; shown = null; showDetail(key); }
      if ($("fbw").hidden === false) { $("fb-body").innerHTML = fbHtml(); fbBind(); }
      if ($("dnw").hidden === false) $("dn-body").innerHTML = dnHtml();
    },
    route: function (h) {
      if (h === "#feedback") { showList(); openFb(); return true; }
      if (h === "#donate") { showList(); openDn(); return true; }
      close();
      var e = Site.byKey(h.slice(1));
      if (e) { showDetail(e.key); return true; }
      showList();
      return false;
    }
  });

  // Recent donations and the Thanks list live in the worker (bot buttons and commands).
  if (Site.cfg.donate.feed) {
    fetch(Site.cfg.donate.feed).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) { if (d && Array.isArray(d.donations)) { Site.cfg.donations = d.donations; renderFeed(); } })
      .catch(function () {});
  }
  if (Site.cfg.feedback) {
    fetch(Site.cfg.feedback.replace(/\/$/, "") + "/thanks", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) { if (d && Array.isArray(d.thanks)) { Site.cfg.thanks = d.thanks; renderThanks(); } })
      .catch(function () {});
  }
})();
</script>
</body>
</html>
